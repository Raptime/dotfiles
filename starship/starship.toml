# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

# Prompt
format = """
($username$hostname:)\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character\
"""

# Modules
[username]
#show_always = true
#style_user = 'yellow'
#style_root = 'red'
format = '[$user]($style)'

[hostname]
#ssh_only = false
#style = 'teal'
format = '@[$hostname]($style)'

[directory]
#style = 'blue'

[git_branch]
#style = 'pink'
format = '[$branch(:$remote_branch) ]($style)'

[git_status]
#style = 'red'
format = '([\[$all_status$ahead_behind\] ]($style))'

[cmd_duration]
#style = 'yellow'
format = '[$duration ]($style)'

[character]
success_symbol = '[\$](green)'
error_symbol = '[\$](red)'
