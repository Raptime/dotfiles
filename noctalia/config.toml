[bar.default]
background_opacity = 0.90
capsule = true
center = [ "worldclock", "clock", "weather", "privacy" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "battery", "session" ]
margin_edge = 4
margin_ends = 6
start = [ "workspaces", "active_window" ]

[control_center.calendar]
show_events_card = false

[idle]
behavior_order = [ "dim", "lock", "screen-off", "suspend" ]
pre_action_fade_seconds = 0

[idle.behavior.dim]
action = "command"
command = "brightnessctl -s set 10%"
resume_command = "brightnessctl -r"
enabled = true
timeout = 120.0

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 180.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 185.0

[idle.behavior.suspend]
action = "suspend"
enabled = true
timeout = 300.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false
monitors = [ "eDP-1", "DP-7" ]

[lockscreen_widgets]
enabled = true

[plugin_settings."nzlov/daily-wallpaper"]
locale = "jp-JP"

[plugins]
enabled = [ "nzlov/daily-wallpaper", "noctalia/world_clock", "thaer99ob/default-apps" ]

[shell]
polkit_agent = true

[shell.greeter_sync]
auto_sync = true

[shell.panel]
control_center_placement = "floating"
wallpaper_placement = "floating"
session_placement = "floating"

[theme]
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "faithful"

[theme.templates]
builtin_ids = [ "alacritty", "gtk3", "gtk4", "kcolorscheme", "niri", "qt" ]
community_ids = [ "pywalfox-beta4", "papirus-icons" ]

[widget.active_window]
title_scroll = "on_hover"

[widget.battery]
hide_when_full = true

[widget.clock]
format = "%a %d | %H:%M"
vertical_format = "%H%n%M"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.worldclock]
type = "noctalia/world_clock:bar"
